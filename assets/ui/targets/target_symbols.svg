      <use xlink:href="#red-outline" fill="#794722" stroke="#794722" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <g id="yellow-socket">
      <use xlink:href="#yellow-outline" fill="none" stroke="url(#socket-lip)" stroke-width="11" stroke-linejoin="round"/>
      <use xlink:href="#yellow-outline" fill="#794722" stroke="#794722" stroke-width="4" stroke-linejoin="round"/>
