  <g>
    <use xlink:href="#red-socket"/><use xlink:href="#red-symbol"/>
    <g transform="translate(256)"><use xlink:href="#yellow-socket"/><use xlink:href="#yellow-symbol"/></g>
    <g transform="translate(512)"><use xlink:href="#amber-socket"/><use xlink:href="#amber-symbol"/></g>
    <g transform="translate(768)"><use xlink:href="#blue-socket"/><use xlink:href="#blue-symbol"/></g>
  </g>
  <g transform="translate(0 256)">
    <use xlink:href="#red-symbol"/>
    <use xlink:href="#yellow-symbol" transform="translate(256)"/>
    <use xlink:href="#amber-symbol" transform="translate(512)"/>
    <use xlink:href="#blue-symbol" transform="translate(768)"/>
